<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="src/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script defer src="main.js"></script>
  <title>Frontend Mentor | Interactive rating component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body class="bg-cust-grey-950 font-overpass flex-center h-screen">

  <main
    class="bg-radial-[at_50%_5%] from-cust-grey-900/75 to-cust-grey-900/60 text-cust-grey-500 md:max-w-106 max-w-95 md:rounded-4xl rounded-2xl  mobile:p-8 py-8 px-6 my-10 mx-4">
    <!-- Rating state start -->
    <article class="md:spacy-6 space-y-7 font-bold" id="rating-state">
      <div class="rounded-full size-12 shrink-0 flex-center bg-cust-grey-900 text-cust-orange-500 text-sm md:mb-9"><i
          class="fa-solid fa-star"></i>
      </div>
      <div class="md:space-y-4 space-y-7">
        <h1 class="text-white md:text-3xl text-2xl">How did we do?</h1>
        <p class="font-normal"> Please let us know how we did with your support request. All feedback is appreciated
          to help us improve our offering!</p>
      </div>

      <form class="space-y-7" id="form">
        <fieldset class="flex justify-between">
          <button type="button" id="rating" class="rate-btn flex-center">1</button>
          <button type="button" id="rating" class="rate-btn flex-center">2</button>
          <button type="button" id="rating" class="rate-btn flex-center">3</button>
          <button type="button" id="rating" class="rate-btn flex-center">4</button>
          <button type="button" id="rating" class="rate-btn flex-center">5</button>
        </fieldset>

        <button
          class="cursor-pointer bg-cust-orange-500 text-cust-grey-950 hover:bg-white px-4 py-3 rounded-full w-full text-center tracking-wider"
          type="submit">
          SUBMIT
        </button>
      </form>
    </article>

    <!-- Rating state end -->

    <!-- Thank you state start -->
    <article class="flex-center flex-col text-center py-4 hidden" id="thank-you-state">
      <img src="/images/illustration-thank-you.svg"
        alt="graphic of a phone with receipt and a card">
      <p class="bg-cust-grey-900 text-cust-orange-500/70 rounded-full py-2 px-4 my-7">
        You selected <span id="rating-display"></span> out of 5
      </p>
      <h1 class="text-white md:text-3xl text-2xl font-semibold mb-5">
        Thank you!
      </h1>
      <p class="">
        We appreciate you taking the time to give a rating. If you ever need more support,
        don’t hesitate to get in touch!
      </p>
    </article>
    <!-- Thank you state end -->
  </main>


  <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </div> -->
</body>

</html>
